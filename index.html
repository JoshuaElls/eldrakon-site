<style>
  html,body { height:100%; margin:0; }
  body {
    background:#000; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia,'Times New Roman',serif;
  }
  /* deep radial glow that breathes behind everything */
  .aura {
    position:fixed; inset:-20%;
    background:radial-gradient(ellipse 55% 45% at 50% 46%,
      rgba(45,212,220,.13), rgba(45,212,220,.05) 45%, transparent 70%);
    animation:breathe 7s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }

  .hero { text-align:center; }
  img.banner {
    width:min(88vw, 1000px); max-height:72vh; object-fit:contain;
    mix-blend-mode:screen;   /* baked black background disappears into the page */
    opacity:0; animation:materialize 2.4s ease-out .3s forwards;
  }
  @keyframes materialize {
    from { opacity:0; transform:scale(.955); }
    to   { opacity:1; transform:scale(1); }
  }
  .tag {
    margin-top:1.1rem; font-size:clamp(.7rem,1.7vmin,.95rem);
    letter-spacing:.6em; text-indent:.6em; text-transform:uppercase;
    color:#7ee7ea; opacity:0; animation:tagin 2s ease-out 1.6s forwards;
    text-shadow:0 0 18px rgba(45,212,220,.55);
  }
  @keyframes tagin { to { opacity:.85; } }

  /* drifting circuit motes */
  .mote {
    position:fixed; border-radius:50%; background:#3fe0e6; pointer-events:none;
    box-shadow:0 0 8px 2px rgba(63,224,230,.5); opacity:0;
    animation-name:drift; animation-iteration-count:infinite;
    animation-timing-function:linear;
  }
  @keyframes drift {
    0%   { transform:translateY(14vh) translateX(0);   opacity:0; }
    12%  { opacity:var(--o); }
    88%  { opacity:var(--o); }
    100% { transform:translateY(-110vh) translateX(var(--sway)); opacity:0; }
  }
</style>
</head>
